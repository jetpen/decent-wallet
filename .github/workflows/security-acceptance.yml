name: Wallet security acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/security-acceptance.yml"
      - ".github/workflows/desktop-rotation-runtime.yml"
      - ".github/workflows/registry-transport-integration.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "uv.toml"
      - "src/decent_wallet/**"
      - "tests/**"
      - "scripts/security_acceptance.py"
      - "scripts/security-acceptance-inventory.json"
      - "platforms/desktop-wallet/**"
      - "scripts/run_wallet_registry_acceptance.py"
      - "platforms/android-wallet/src/**"
      - "platforms/android-wallet/build.gradle.kts"
      - "platforms/android-wallet/gradle.lockfile"
      - "platforms/android-wallet/gradle/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "docs/specs/wallet-implementation.md"
      - "docs/verification/security-acceptance.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-acceptance.yml"
      - ".github/workflows/desktop-rotation-runtime.yml"
      - ".github/workflows/registry-transport-integration.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "uv.toml"
      - "src/decent_wallet/**"
      - "tests/**"
      - "scripts/security_acceptance.py"
      - "scripts/security-acceptance-inventory.json"
      - "platforms/desktop-wallet/**"
      - "scripts/run_wallet_registry_acceptance.py"
      - "platforms/android-wallet/src/**"
      - "platforms/android-wallet/build.gradle.kts"
      - "platforms/android-wallet/gradle.lockfile"
      - "platforms/android-wallet/gradle/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "docs/specs/wallet-implementation.md"
      - "docs/verification/security-acceptance.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out wallet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run the locked Python security matrix
        run: uv run --locked --extra test python scripts/security_acceptance.py --profile core --receipt "$RUNNER_TEMP/wallet-security-receipt.json"

  android-jvm-security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out wallet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Python test dependencies
        run: uv sync --locked --extra test
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Run Android wallet JVM security suite
        run: uv run --locked --extra test python scripts/security_acceptance.py --profile android-jvm --receipt "$RUNNER_TEMP/android-jvm-security-receipt.json"

  podman-registry-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out wallet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: decent-wallet
      - name: Check out pinned Registry provider
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jetpen/decent-registry
          ref: 3e561bbdaf7c6da85528a717dd555445d5e7dff7
          path: decent-registry
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.19"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: decent-wallet/uv.lock
      - name: Install and verify rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
      - name: Gate disposable Podman Registry deployment
        working-directory: decent-wallet
        run: |
          env -u PYTEST_ADDOPTS uv run --locked --extra test --extra registry \
            python scripts/run_wallet_registry_acceptance.py \
            --desktop-only --peer-backend podman \
            --registry-repo "$GITHUB_WORKSPACE/decent-registry"

  registry-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out wallet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: decent-wallet
      - name: Check out pinned Registry provider
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jetpen/decent-registry
          ref: 3e561bbdaf7c6da85528a717dd555445d5e7dff7
          path: decent-registry
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: decent-wallet/uv.lock
      - name: Install locked test dependencies and pinned provider
        working-directory: decent-wallet
        run: uv sync --locked --extra test --extra registry
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Run full acceptance and produce fresh Kotlin artifacts
        working-directory: decent-wallet
        env:
          PORTABLE_LATCH_ARTIFACT_DIR: ${{ runner.temp }}/kotlin-artifacts
        run: uv run --locked --extra test --extra registry python scripts/security_acceptance.py --profile full --receipt "$RUNNER_TEMP/full-security-receipt.json"
