name: Registry transport integration

on:
  pull_request:
    paths:
      - ".github/workflows/registry-transport-integration.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/decent_wallet/identity.py"
      - "src/decent_wallet/container.py"
      - "tests/test_portable_latch.py"
      - "tests/interop/generate_portable_latch_vector.py"
      - "docs/adr/0007-portable-environment-bound-rotation-latch.md"
      - "docs/adr/0002-wallet-container-v2-dispatch-intent.md"
      - "platforms/android-wallet/src/main/kotlin/org/decentwallet/wallet/android/**"
      - "platforms/android-wallet/src/test/kotlin/org/decentwallet/wallet/android/PortableLatchTest.kt"
      - "src/decent_wallet/registry_transport.py"
      - "tests/test_registry_transport_integration.py"
      - "tests/test_portable_latch_registry_integration.py"
      - "tests/test_android_registry_peer.py"
      - "tests/interop/start_android_registry_peer.py"
      - "tests/vectors/identity-owner-key-rotation-legacy.json"
      - "tests/vectors/identity-owner-key-rotation-versioned-history.json"
      - "tests/vectors/wallet-v2-portable-rotation-latch.json"
      - "scripts/test-registry-integration.sh"
      - "docs/adr/0006-direct-dht-best-effort-rotation.md"
      - "docs/specs/wallet-implementation.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/registry-transport-integration.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "src/decent_wallet/identity.py"
      - "src/decent_wallet/container.py"
      - "tests/test_portable_latch.py"
      - "tests/interop/generate_portable_latch_vector.py"
      - "docs/adr/0007-portable-environment-bound-rotation-latch.md"
      - "docs/adr/0002-wallet-container-v2-dispatch-intent.md"
      - "platforms/android-wallet/src/main/kotlin/org/decentwallet/wallet/android/**"
      - "platforms/android-wallet/src/test/kotlin/org/decentwallet/wallet/android/PortableLatchTest.kt"
      - "src/decent_wallet/registry_transport.py"
      - "tests/test_registry_transport_integration.py"
      - "tests/test_portable_latch_registry_integration.py"
      - "tests/test_android_registry_peer.py"
      - "tests/interop/start_android_registry_peer.py"
      - "tests/vectors/identity-owner-key-rotation-legacy.json"
      - "tests/vectors/identity-owner-key-rotation-versioned-history.json"
      - "tests/vectors/wallet-v2-portable-rotation-latch.json"
      - "scripts/test-registry-integration.sh"
      - "docs/adr/0006-direct-dht-best-effort-rotation.md"
      - "docs/specs/wallet-implementation.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-dht-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out wallet
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: decent-wallet

      # Pin the provider API used by the transport. Advance this SHA deliberately
      # when a newer decent-registry revision becomes the supported integration target.
      - name: Check out decent-registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jetpen/decent-registry
          ref: 3e561bbdaf7c6da85528a717dd555445d5e7dff7
          path: decent-registry
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: decent-wallet/uv.lock

      - name: Run locked wallet tests with optional Registry coverage
        working-directory: decent-wallet
        run: uv run --locked --extra test --extra registry pytest

      - name: Run Registry/DHT integration tests
        working-directory: decent-wallet
        env:
          DECENT_REGISTRY_PATH: ../decent-registry
        run: scripts/test-registry-integration.sh
