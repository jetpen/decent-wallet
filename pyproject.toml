[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decent-wallet"
version = "0.1.0"
description = "A secret-preserving decentralized wallet"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "cbor2>=5.6",
    "cryptography>=42",
    "pycryptodome>=3.20",
]

[project.scripts]
decent-wallet = "decent_wallet.desktop_cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-trio>=0.8"]
registry = [
    "decent-registry @ git+https://github.com/jetpen/decent-registry.git@3e561bbdaf7c6da85528a717dd555445d5e7dff7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not registry_integration'"
markers = [
    "registry_integration: exercises the optional direct-DHT Registry integration",
]
