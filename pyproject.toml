[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decent-wallet"
version = "0.1.0"
description = "A secret-preserving decentralized wallet"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
