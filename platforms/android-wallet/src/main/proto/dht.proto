syntax = "proto3";
package dht.pb;

option java_package = "org.decentwallet.wallet.android.dht.proto";
option java_outer_classname = "DhtProtos";
option java_multiple_files = true;

import "record.proto";

// Wire schema from libp2p/go-libp2p-kad-dht/pb/dht.proto.
message Message {
  enum MessageType {
    PUT_VALUE = 0;
    GET_VALUE = 1;
    ADD_PROVIDER = 2;
    GET_PROVIDERS = 3;
    FIND_NODE = 4;
    PING = 5;
  }

  enum ConnectionType {
    NOT_CONNECTED = 0;
    CONNECTED = 1;
    CAN_CONNECT = 2;
    CANNOT_CONNECT = 3;
  }

  message Peer {
    bytes id = 1;
    repeated bytes addrs = 2;
    ConnectionType connection = 3;
  }

  MessageType type = 1;
  bytes key = 2;
  record.pb.Record record = 3;
  repeated Peer closerPeers = 8;
  repeated Peer providerPeers = 9;
  int32 clusterLevelRaw = 10;
}
